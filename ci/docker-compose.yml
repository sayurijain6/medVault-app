# Jenkins + SonarQube for MedVault.
#   cd ci && docker compose up -d --build
#   Jenkins:   http://localhost:8080   (admin / admin unless JENKINS_ADMIN_PASSWORD is set)
#   SonarQube: http://localhost:9000   (admin / admin, asks for a new password on first login)
services:
  jenkins:
    build: ./jenkins
    user: root                      # needed to use the host Docker socket
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      MEDVAULT_REPO_URL: ${MEDVAULT_REPO_URL:-https://github.com/sayurijain6/medVault-app.git}
      SONAR_HOST_URL: http://sonarqube:9000
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - sonarqube

  sonarqube:
    image: sonarqube:10.7.0-community
    ulimits:                        # Elasticsearch inside SonarQube needs these
      nofile:
        soft: 65536
        hard: 65536
      nproc: 8192
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db

  sonar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db:
