# Run MedVault locally without Kubernetes:  docker compose up --build
# Open http://localhost:3000
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend
